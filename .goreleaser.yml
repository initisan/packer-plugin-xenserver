version: 2
# This is an example goreleaser.yaml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com

# Packer requires the plugin binary to be named packer-plugin-<name>, and every
# name template below is built from .ProjectName. GoReleaser would otherwise infer
# the project name from the git remote, which for this repository is
# "xenserver-packer" — the repository holds more than the plugin. Upstream never
# needed this line because its repository is named after the plugin.
project_name: packer-plugin-xenserver
env:
  - CGO_ENABLED=0
before:
  hooks:
    # As part of the release doc files are included as a separate deliverable for
    # consumption by Packer.io: the hook below renders docs/ into docs.zip, which
    # the `release` stanza attaches to the draft release as an extra file.
    - make ci-release-docs
    # Check plugin compatibility with required version of the Packer SDK
    - make plugin-check
builds:
  # Vestigial upstream split: the SDK check runs in the before hook, not on this artifact.
  -
    id: plugin-check
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X {{ .ModulePath }}/version.Version={{.Version}} -X {{ .ModulePath }}/version.VersionPrerelease= '
    goos:
      - linux
    goarch:
      - amd64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}'
  -
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath #removes all file system paths from the compiled executable
    ldflags:
      - '-s -w -X {{ .ModulePath }}/version.Version={{.Version}} -X {{ .ModulePath }}/version.VersionPrerelease= '
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    # CA-430327: 386 and arm omitted — VirtualSize is declared as Go int, which
    # is 32-bit on those platforms and silently truncates disk sizes >2 GiB.
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: amd64
    binary: '{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}'
archives:
- formats: [ zip ]
  files:
    - none*
  name_template: '{{ .ProjectName }}_v{{ .Version }}_{{ .Env.API_VERSION }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_v{{ .Version }}_SHA256SUMS'
  algorithm: sha256
signs:
  - artifacts: checksum
    args:
      # No tty in CI, so gpg must not prompt.
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
release:
  draft: true
  extra_files:
  - glob: ./docs.zip
  # The signing key travels with every release. Nothing in Packer checks the
  # signature, so a reader who wants to check it by hand needs the key within
  # reach rather than having to go and find it. See KEYS.
  - glob: ./KEYS

# Read only in snapshot mode: plugin-snapshot.yml builds an untagged archive for
# manual testing, and needs release-shaped names, not the commit-derived default.
snapshot:
  version_template: '{{ .Env.PLUGIN_VERSION }}'

changelog:
  disable: true
